[package]
name = "rust-ocr-runner"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone (its own workspace): runs this checkout's bello-platform OCR on files.
# cargo run --release --manifest-path rust/docs/validation/ocr-swift-oracle-2026-10-10/rust-runner/Cargo.toml -- IMAGE
[workspace]

[dependencies]
bello-platform = { path = "../../../../crates/bello-platform" }

[profile.release]
lto = "thin"
codegen-units = 1
