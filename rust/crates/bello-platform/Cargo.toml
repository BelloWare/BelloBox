[package]
name = "bello-platform"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Explicit, bounded platform adapters for the BelloBox Rust port"

[features]
# Enables only app-owned generated movies for cross-crate host CI. No path bypass.
recording-fixtures = ["movie-fixtures"]
movie-fixtures = ["objc2-av-foundation/AVAssetWriter", "objc2-av-foundation/AVAssetWriterInput", "objc2-av-foundation/AVVideoSettings"]

[dependencies]
libc.workspace = true

[dev-dependencies]
# Existing workspace-locked SHA-256; binds the independent Swift test source.
sha2 = "=0.10.9"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
raw-window-handle = "=0.6.2"

objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSObjCRuntime", "NSString", "NSURL", "NSValue", "objc2-core-foundation"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes", "objc2"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "AVAsset", "AVAssetWriter", "AVAssetWriterInput", "AVVideoSettings", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVAsynchronousKeyValueLoading", "AVMediaFormat", "block2", "objc2-core-foundation", "objc2-core-media"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "CMBase", "CMFormatDescription", "CMSampleBuffer", "CMTime", "CMTimeRange", "objc2", "objc2-core-video"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "objc2"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGAffineTransform", "CGBase", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGGeometry", "CGImage", "objc2"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["AVAssetWriter", "AVAssetWriterInput", "AVVideoSettings"] }
bellobox-core = { path = "../bellobox-core", default-features = false }
