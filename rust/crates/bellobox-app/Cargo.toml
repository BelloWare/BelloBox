[package]
name = "bellobox-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "bellobox"
path = "src/main.rs"

[features]
default = ["developer-tools"]
developer-tools = ["bellobox-core/developer-tools"]
movie-fixtures = ["bello-platform/movie-fixtures"]
recording-fixtures = ["bello-platform/recording-fixtures"]

[dependencies]
gpui.workspace = true
libc.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
bellobox-core = { path = "../bellobox-core", default-features = false }
bello-platform = { path = "../bello-platform" }
bello-workbench-ui = { path = "../bello-workbench-ui" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Already locked transitively; image OCR owns its response timer/runtime lifetime.
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "net", "time"] }

uuid = { version = "1", features = ["v4"] }
unicode-segmentation = "1.13.3"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "=0.6.2"
