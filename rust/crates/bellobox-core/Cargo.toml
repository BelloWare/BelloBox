[package]
name = "bellobox-core"
version = "0.1.0"
edition = "2024"

[features]
default = ["developer-tools"]
developer-tools = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
base64 = "0.22"
percent-encoding = "2"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg", "image"] }
url = "2"
x509-parser = { version = "0.18", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1"
semver = "1"
hmac = "0.12"
unicode-normalization = "=0.1.25"
uuid = { version = "1", features = ["v4"] }
roxmltree = "0.20"
yaml-rust2 = "0.10"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
cosmic-text = { version = "0.14.2", default-features = false, features = ["std", "swash"] }

[dev-dependencies]
tempfile = "3"
