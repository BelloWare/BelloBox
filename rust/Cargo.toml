[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
# GPUI 0.2.2 transitively uses xattr 0.2, which requires libc::ENOATTR.
libc = "=0.2.186"
gpui = { version = "=0.2.2", default-features = false, features = ["x11", "wayland", "font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 0
incremental = false
