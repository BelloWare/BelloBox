name: Rust macOS native checks
on:
  push:
    branches: [rust]
    paths: ['rust/**', '.github/workflows/rust-macos.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Finish the running native build; only the newest pending checkpoint waits.
  group: rust-macos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apple-silicon:
    # Standard runners are free for public repos; never consume paid private minutes.
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify native Apple toolchain
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --find clang
          xcrun --find metal
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy
          rustup override set 1.99.0
          rustc --version
      - name: Compile and link all native test targets
        run: cargo test --locked --workspace --no-run
      - name: Lint normal and synthetic native platform paths
        run: cargo clippy --locked -p bello-platform --all-targets --no-deps -- -D warnings
      - name: Compare raw movie decoding with the independent Swift source
        # Fixed generated movie only. The test compiles hash-bound excerpts of
        # the shipped Swift converter and compares all pixels/PTS exactly.
        run: |
          oracle=recording::tests::checked_in_raw_movie_native_decode_matches_independent_swift_source_exactly
          cargo test --locked -p bello-platform -- --list | grep -Fx "$oracle: test"
          cargo test --locked -p bello-platform "$oracle" -- --exact --show-output
      - name: Verify bounded Swift text oracle is present
        # The following complete Core suite executes it once; this step only lists.
        run: |
          oracle=native::native_swift_count_and_unique_match_pinned_source
          cargo test --locked -p bellobox-core --test text_swift_oracle -- --list | grep -Fx "$oracle: test"
      - name: Run pure domain and filesystem tests
        # No GPUI application launch, permissions, keychain, capture or updater actions.
        run: cargo test --locked -p bellobox-core -p bello-workbench -p bello-platform -- --show-output
      - name: Characterize synthetic CoreGraphics alpha without capture
        run: cargo test --locked -p bello-platform native_alpha_ -- --show-output
      - name: Test supplied-image Window host mask without GPUI launch
        run: cargo test --locked -p bellobox-app screenshot_ui::window_refresh::tests::supplied_image_host_mask_prepares_on_worker -- --show-output
      - name: Test generated movie converter host and closed native gate
        run: |
          cargo test --locked -p bellobox-app --features movie-fixtures gif_converter::native_host_tests -- --test-threads=1 --show-output
          cargo test --locked -p bellobox-app --features movie-fixtures gif_converter::tests::production_adapter_is_truthfully_unavailable_before_path_io
          cargo clippy --locked -p bello-platform --all-targets --features movie-fixtures --no-deps -- -D warnings
      - name: Test generated recording writer and physical callback retirement
        # Runs native_generated_writer_finalizes_and_same_owned_token_decodes and
        # native_finish_callback_hold_keeps_lease_until_real_block_and_pool_retire.
        # Fixed generated media only; no ScreenCaptureKit, permissions or capture.
        env:
          CARGO_BUILD_JOBS: '1'
        run: |
          cargo test --locked -p bello-platform --features recording-fixtures recording:: -- --test-threads=1 --show-output
      - name: Run full App suite with recording and shutdown fixtures
        # TestAppContext uses TestPlatform, not a native interactive GUI launch.
        # Keep the complete suite; local focused-module evidence does not replace it.
        env:
          CARGO_BUILD_JOBS: '1'
        run: cargo test --locked -p bellobox-app --features recording-fixtures -- --test-threads=1 --show-output
      - name: Lint recording feature App and native platform paths
        env:
          CARGO_BUILD_JOBS: '1'
        run: cargo clippy --locked -p bellobox-app -p bello-platform --all-targets --features recording-fixtures --no-deps -- -D warnings
      - name: Test immutable image OCR on generated pixels and numeric loopback
        # Pure local fixtures. No credentials, paid endpoints, native GUI or capture.
        # 12 transport tests, including accepted-socket blocking normalization.
        run: cargo test --locked -p bellobox-app transport::image_ocr::tests -- --test-threads=1 --show-output
      - name: Test image OCR consent and inline retirement on the GPUI test platform
        # TestAppContext uses TestPlatform; these are not native interactive UI tests.
        # 18 controller tests and 12 actual-inline coordinator tests.
        run: |
          cargo test --locked -p bellobox-app screenshot_ui::ai_ocr::tests -- --test-threads=1 --show-output
          cargo test --locked -p bellobox-app screenshot_ui::main_area::selector::ai_fixture::tests -- --test-threads=1 --show-output
      - name: Build native applications without launching
        run: cargo build --locked --workspace
      - name: Test isolated preview packaging policy
        run: python3 -m unittest discover -s scripts -p 'test_package_bellobox_macos.py' -v
      - name: Assemble and verify offline development preview
        run: |
          env -u SIGN_IDENTITY -u SPARKLE_FRAMEWORK -u RUST_SPARKLE_FEED_URL -u SPARKLE_PUBLIC_ED_KEY \
            PACKAGE_PROFILE=debug OUT_DIR="$RUNNER_TEMP/bellobox-preview" \
            bash scripts/package-bellobox-macos.sh
          python3 scripts/validate-bellobox-macos.py \
            "$RUNNER_TEMP/bellobox-preview/BelloBox Rust.app" --require-offline
          codesign --verify --deep --strict --verbose=2 \
            "$RUNNER_TEMP/bellobox-preview/BelloBox Rust.app"
